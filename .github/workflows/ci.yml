name: sophia-code
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Kernel compile
        run: python -m compileall -q agent sophia tools
      - name: Edition gate
        run: python tests/test_sophia_edition.py
      - name: CLI smoke (mock)
        run: python -m sophia.cli --json --readonly --no-tools --mock -p "reply with pong"
        env:
          SOPHIA_UI: python
          SOPHIA_EDITION: oss
      - name: TUI tests
        working-directory: apps/sophia-tui
        run: npm ci && npm test
