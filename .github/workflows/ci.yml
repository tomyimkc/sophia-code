name: sophia-code
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Kernel compile
        run: python -m compileall -q agent tools
      - name: Edition gate
        run: python tests/test_sophia_edition.py
      - name: TUI tests
        working-directory: apps/sophia-tui
        run: npm ci && npm test
